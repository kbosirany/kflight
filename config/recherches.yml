# Configuration des recherches de vols kflight.
# Toute modification ici est prise en compte à la prochaine collecte.

# Nombre de voyageurs : sert uniquement à calculer le coût total du groupe.
# Les prix sont collectés pour 1 adulte, donc changer ce chiffre ne casse pas
# l'historique.
voyageurs: 6

devise: EUR

# Fenêtre d'arrivée à Antsiranana (Diego-Suarez).
arrivee_min: 2027-08-16
arrivee_max: 2027-08-20

# Dates de départ de France testées. Seuls comptent les vols qui arrivent
# dans la fenêtre ci-dessus.
dates_depart: [2027-08-16, 2027-08-17, 2027-08-18, 2027-08-19]

# Durées de séjour testées, en jours (date retour = date départ + durée) :
# 3, 4 et 5 semaines.
durees_sejour: [21, 28, 35]

# Aéroports de départ possibles. Plusieurs codes séparés par une virgule sont
# cherchés ensemble (ex. les deux aéroports de Paris).
origines:
  - nom: Paris
    codes: CDG,ORY
  - nom: Bordeaux
    codes: BOD
  - nom: Montpellier
    codes: MPL

# Aéroports d'arrivée possibles.
destinations:
  - nom: Diego-Suarez
    codes: DIE
  - nom: Nosy Be
    codes: NOS

# Budget par personne pour un aller-retour, en euros. Une alerte est envoyée
# par e-mail (issue GitHub) quand un aller-retour passe sous `vol_cible_max`.
budget:
  vol_cible_min: 1000   # très bon prix pour le vol
  vol_cible_max: 1200   # bon prix pour le vol
  total_max: 1500       # plafond tout compris (vol + route jusqu'à Diego)
  baisse_min: 50        # nouvelle alerte seulement si le prix baisse d'au moins 50 €

# Nombre de recherches par collecte quotidienne. L'offre gratuite de SerpApi
# donne 250 recherches par mois : 8 par jour font environ 243 par mois.
recherches_par_jour: 8

# Demande à SerpApi les mêmes résultats que le navigateur Google Flights
# (recherche plus lente). Testé le 30/09/2026 : mêmes résultats sans cette option, donc désactivée.
deep_search: false

# Google Flights ne propose des vols qu'environ 11 mois à l'avance. Tant que la
# date de retour dépasse aujourd'hui + horizon_jours, seul l'aller est cherché.
horizon_jours: 330

# Combinaisons cherchées à chaque collecte, avant la rotation des autres.
# Chaque entrée précise origine, destination, date de départ et durée (la
# durée ne compte pas tant que seul l'aller est cherché). Les autres
# combinaisons (autres dates, Bordeaux, Montpellier) tournent avec les
# recherches qui restent.
suivi_quotidien:
  - {origine: Paris, destination: Diego-Suarez, depart: 2027-08-17, duree: 28}
  - {origine: Paris, destination: Nosy Be, depart: 2027-08-17, duree: 28}
  - {origine: Paris, destination: Diego-Suarez, depart: 2027-08-18, duree: 28}
  - {origine: Paris, destination: Nosy Be, depart: 2027-08-18, duree: 28}
