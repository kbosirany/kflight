name: Collecte et tableau de bord

on:
  schedule:
    # Tous les jours à 05:17 UTC (07:17 à Paris l'été).
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      collecter:
        description: "Lancer aussi une collecte de prix (consomme le quota SerpApi)"
        type: boolean
        default: true
      tester_alerte:
        description: "Envoyer une alerte de test (issue GitHub, donc e-mail) pour vérifier les notifications"
        type: boolean
        default: false
  push:
    paths: ["config/**", "data/prix_manuels.csv", "dashboard/**", "R/**"]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::ggplot2
            any::knitr
            any::rmarkdown
            local::.

      - name: Collecter les prix du jour
        if: github.event_name == 'schedule' || inputs.collecter
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: Rscript -e 'kflight::collecter()'

      - name: Préparer l'alerte de prix
        if: github.event_name == 'schedule' || inputs.collecter
        run: Rscript -e 'kflight::preparer_alertes()'

      - name: Enregistrer les données dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Aucune nouvelle donnée."
          else
            git commit -m "Collecte du $(date -u +%Y-%m-%d)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Envoyer l'alerte de prix (issue GitHub, donc e-mail)
        if: hashFiles('alerte_corps.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "$(cat alerte_titre.txt)" --body-file alerte_corps.md

      - name: Envoyer une alerte de test
        if: inputs.tester_alerte
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh issue create --title "Test d'alerte kflight" \
            --body "@kbosirany ceci est un test : si tu reçois ce message par e-mail, les alertes de prix fonctionnent. Cette issue se ferme toute seule.")
          gh issue close "$url" --comment "Test terminé."

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Construire le tableau de bord
        run: quarto render dashboard/index.qmd --output-dir ../_site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publication:
    needs: collecte
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
